name: ModelScope mobile sort status
on:
  push:
    branches: [codex/mobile-home-food-sort]
    paths: [.github/workflows/modelscope-mobile-sort-status.yml]
permissions:
  contents: read
jobs:
  status:
    if: github.repository == 'hz9404807-ctrl/zju-campus-guide' && github.ref == 'refs/heads/codex/mobile-home-food-sort'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Read status and bounded log signals without exposing logs
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { studioRequest } from './scripts/modelscope-release.mjs'
          const options = { token: process.env.MODELSCOPE_TOKEN }
          const root = '/studios/zzzhr777/zju-campus-guide'
          const studio = await studioRequest(root, options)
          console.log(JSON.stringify({status: studio.status, runtimeStatus: studio.runtime?.status, hardware: studio.hardware}))
          for (const kind of ['build', 'run']) {
            try {
              const data = await studioRequest(root + '/logs/' + kind, options)
              const logs = typeof data === 'string' ? data : JSON.stringify(data)
              console.log(JSON.stringify({kind, type: typeof data, length: logs?.length ?? 0, listening: logs?.includes('Campus guide listening on port 7860') ?? false, errors: (logs?.match(/error|failed|exception/gi) ?? []).length, imageBuilt: /successfully built|exporting to image|image digest|DONE/i.test(logs ?? '')}))
            } catch { console.log(JSON.stringify({kind, readable: false})) }
          }
          JS
